<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="35%" stop-color="#060914"/>
      <stop offset="70%" stop-color="#080d1e"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Atmospheric Cyber Glows -->
    <radialGradient id="cyanHaze" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0088ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleHaze" cx="75%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomNeonGlow" cx="50%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Isometric / Perspective Cyber Grid -->
    <pattern id="matrixGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.04"/>
      <circle cx="60" cy="60" r="1" fill="#00f2fe" fill-opacity="0.1"/>
    </pattern>

    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Base -->
  <rect width="100%" height="100%" fill="url(#cyberSky)"/>

  <!-- Glowing Nebulae -->
  <rect width="100%" height="100%" fill="url(#cyanHaze)"/>
  <rect width="100%" height="100%" fill="url(#purpleHaze)"/>
  <rect width="100%" height="100%" fill="url(#bottomNeonGlow)"/>

  <!-- Cyber Grid -->
  <rect width="100%" height="100%" fill="url(#matrixGrid)"/>

  <!-- Distant Metroidvania Level Geometry (Smooth, Atmospheric Silhouettes) -->
  <path d="M 0 680 L 260 680 L 320 620 L 580 620 L 640 680 L 980 680 L 1040 580 L 1320 580 L 1400 680 L 1920 680 L 1920 1080 L 0 1080 Z" fill="#05070f" opacity="0.75"/>
  <path d="M 120 740 L 480 740 L 520 790 L 880 790 L 920 740 L 1480 740 L 1540 820 L 1920 820 L 1920 1080 L 0 1080 Z" fill="#03050a" opacity="0.9"/>

  <!-- Neon Platform Edges / Laser Guideways -->
  <path d="M 0 680 L 260 680 L 320 620 L 580 620 L 640 680 L 980 680 L 1040 580 L 1320 580 L 1400 680 L 1920 680" fill="none" stroke="url(#neonBeam)" stroke-width="1.8" opacity="0.55"/>
  <line x1="0" y1="740" x2="1920" y2="740" stroke="#00f2fe" stroke-width="0.8" stroke-dasharray="8 16" opacity="0.25"/>

  <!-- Subtle Hanging Cyber Cables across the map -->
  <path d="M 0 280 Q 480 440 960 320 T 1920 300" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.12"/>
  <path d="M 0 340 Q 520 520 1020 380 T 1920 360" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.10"/>

  <!-- Geometric Hexagon GDD Nodes -->
  <g transform="translate(960, 420)" opacity="0.08" stroke="#00f2fe">
    <circle r="220" fill="none" stroke-width="1" stroke-dasharray="6 8"/>
    <circle r="320" fill="none" stroke-width="0.5"/>
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke-width="1.5"/>
  </g>
</svg>
